<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--red:#A8241D;--ink:#100D0B;--cream:#F2EADF;--paper:#F7F2EA;--indigo:#1D2856;--gold:#E2B13C;--line:rgba(16,13,11,.14)}
body{background:#E6E0D6;font-family:"Inter",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.page{width:1440px;margin:0 auto;background:var(--paper);overflow:hidden}
.mono{font-family:"Anonymous Pro","DejaVu Sans Mono",monospace;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.disp{font-family:"Inter Display","Inter",sans-serif;font-weight:800;letter-spacing:-.045em;line-height:.86}
.pill{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:500;background:rgba(255,255,255,.12);color:#fff;backdrop-filter:blur(6px)}
.pill.dark{background:rgba(16,13,11,.06);color:var(--ink)}
.cta{display:inline-flex;align-items:center;gap:14px;height:52px;padding:0 6px 0 24px;border-radius:999px;background:#fff;color:var(--ink);font-weight:600;font-size:15px}
.cta i{width:40px;height:40px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center}
.cta.ink{background:var(--ink);color:#fff}.cta.ink i{background:#fff}
svg{display:block}
/* hero */
.hero{position:relative;height:940px;background:var(--red);color:#fff;overflow:hidden}
.hero .grain{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:multiply;opacity:.55}
.nav{position:absolute;top:24px;left:32px;right:32px;display:flex;align-items:center;justify-content:space-between;z-index:5}
.nav .grp{display:flex;gap:8px;width:420px}.nav .grp.r{justify-content:flex-end}
.hero .fig{position:absolute;left:470px;top:70px;width:690px;height:920px}
.hero h1{position:absolute;left:32px;top:370px;font-size:136px;color:#fff}
.hero .meta{position:absolute;left:32px;right:32px;top:612px;display:flex;justify-content:space-between}
.strip{position:absolute;left:0;right:0;top:650px;height:170px;display:flex;gap:4px;align-items:flex-start}
.strip .t{flex:none;width:200px;height:170px;overflow:hidden;position:relative}
.strip .t.big{width:216px;height:260px}
.strip .t span{position:absolute;left:8px;bottom:8px;color:#fff;background:rgba(16,13,11,.6);padding:3px 7px;border-radius:4px;font-size:11px}
.prog{position:absolute;left:32px;bottom:34px;width:320px;display:flex;flex-direction:column;gap:8px}
.prog .bar{height:2px;background:rgba(255,255,255,.3);position:relative}.prog .bar b{position:absolute;left:0;top:0;height:2px;width:54px;background:#fff}
.hero .shop{position:absolute;right:32px;bottom:24px}
/* cloth */
.cloth{padding:56px 32px 64px;background:var(--paper)}
.cols{display:flex;justify-content:space-between;gap:24px}
.cols > div{width:300px;line-height:18px}
.cols b{font-weight:700}
.big-word{position:relative;margin-top:150px;height:300px;display:flex;align-items:center;justify-content:center}
.big-word .disp{font-size:330px;line-height:1;letter-spacing:-.06em;display:flex;gap:0}
.big-word .gap{width:250px}
.big-word .inset{position:absolute;left:575px;top:-60px;width:270px;height:420px;overflow:hidden;box-shadow:0 30px 60px rgba(16,13,11,.25)}
.swatches{display:flex;justify-content:center;gap:18px;margin-top:96px}
.sw{display:flex;flex-direction:column;align-items:center;gap:8px;width:120px}
.sw .s{width:120px;height:72px;overflow:hidden;filter:grayscale(1);opacity:.75}
.sw.on .s{filter:none;opacity:1;outline:2px solid var(--ink);outline-offset:3px}
.sw.on .mono{font-weight:700}
.tags{text-align:center;margin-top:36px;line-height:22px;color:rgba(16,13,11,.6)}
/* shop */
.shopsec{padding:80px 32px;border-top:1px solid var(--line)}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:32px}
.sec-head h2{font-size:96px}
.filters{display:flex;gap:8px}
.grid{display:flex;flex-wrap:wrap;gap:40px 16px}
.card{width:332px;display:flex;flex-direction:column;gap:12px}
.card .img{width:332px;height:415px;overflow:hidden;position:relative}
.card .img .tag{position:absolute;left:12px;top:12px;background:var(--paper);padding:4px 8px;border-radius:4px}
.card .row{display:flex;justify-content:space-between;align-items:baseline}
.card .name{font-weight:600;font-size:16px}
.card .price{font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.card .mono{color:rgba(16,13,11,.55)}
/* archive */
.archive{position:relative;background:var(--ink);color:#fff;height:900px;overflow:hidden}
.archive .ghost{position:absolute;left:50%;top:40px;transform:translateX(-50%);opacity:.06}
.fan{position:absolute;left:0;right:0;top:170px;height:460px}
.fan .c{position:absolute;width:300px;height:380px;border-radius:22px;overflow:hidden;border:1.5px solid rgba(255,255,255,.35);box-shadow:0 30px 60px rgba(0,0,0,.5)}
.fan .c .lab{position:absolute;left:16px;right:16px;bottom:14px;display:flex;justify-content:space-between;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.archive .copy{position:absolute;left:0;right:0;top:680px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:20px}
.archive h2{font-family:"Inter Display","Inter";font-weight:300;font-size:64px;letter-spacing:-.03em;line-height:1}
.archive p{color:rgba(255,255,255,.65);font-size:17px}
/* journal */
.journal{position:relative;height:860px;background:#2F4FB8;color:#fff;overflow:hidden}
.journal .fig{position:absolute;right:120px;top:90px;width:640px;height:850px}
.journal .top{position:absolute;left:32px;right:32px;top:28px;display:flex;justify-content:space-between}
.journal h2{position:absolute;left:32px;top:210px;font-size:120px;width:820px;color:#fff}
.journal .dek{position:absolute;left:32px;top:560px;width:420px;font-family:"Crimson Text",serif;font-size:24px;line-height:31px;font-style:italic}
.journal .read{position:absolute;left:32px;bottom:48px}
.stories{display:flex;gap:16px;padding:40px 32px 80px}
.story{flex:1;display:flex;flex-direction:column;gap:12px}
.story .img{height:260px;overflow:hidden}
.story h3{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:28px}
.story .mono{color:rgba(16,13,11,.55)}
/* promises */
.promise{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.promise div{flex:1;padding:28px 32px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.promise div:first-child{border-left:0}
.promise b{font-size:16px;font-weight:600}
.promise span{font-size:14px;color:rgba(16,13,11,.6);line-height:20px}
/* footer */
.foot{background:var(--red);color:#fff;padding:56px 32px 28px;position:relative;overflow:hidden}
.foot .fcols{display:flex;gap:64px}
.foot .news{width:440px;display:flex;flex-direction:column;gap:16px}
.foot .news h3{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:34px}
.foot .field{display:flex;height:52px;border-bottom:1.5px solid #fff;align-items:center;justify-content:space-between;font-size:16px;color:rgba(255,255,255,.7)}
.foot ul{list-style:none;display:flex;flex-direction:column;gap:10px;font-size:15px}
.foot .mark{margin-top:72px}
.foot .base{display:flex;justify-content:space-between;margin-top:28px;opacity:.75}
.cur{display:flex;gap:6px;flex-wrap:wrap}
.cur span{border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:5px 10px}
.cur span.on{background:#fff;color:var(--red)}

.topnav{display:flex;align-items:center;justify-content:space-between;padding:24px 32px;position:relative;z-index:5}
.topnav .grp{display:flex;gap:8px;width:440px}.topnav .grp.r{justify-content:flex-end}
.on-paper .pill{background:rgba(16,13,11,.06);color:var(--ink)}
.crumb{color:rgba(16,13,11,.55)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 24px;border-radius:999px;font-weight:600;font-size:15px;background:var(--ink);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.light{background:#fff;color:var(--ink)}
.chip{display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:500}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.rule{height:1px;background:var(--line)}
h1.disp,h2.disp{font-weight:800}
.lead{font-size:19px;line-height:28px;color:rgba(16,13,11,.75)}
.body{font-family:"Crimson Text",Georgia,serif;font-size:22px;line-height:34px;color:#231c17}
.acc{border-top:1px solid var(--line)}
.acc .h{display:flex;justify-content:space-between;align-items:center;padding:18px 0;font-weight:600;font-size:16px}
.acc .c{padding:0 0 18px;font-size:15px;line-height:23px;color:rgba(16,13,11,.72)}
.field2{display:flex;flex-direction:column;gap:6px;flex:1}
.field2 label{font-size:13px;font-weight:600}
.inp{height:48px;border:1px solid rgba(16,13,11,.22);border-radius:10px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;font-size:15px;background:#fff}
.inp.ph{color:rgba(16,13,11,.4)}
.opt{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid rgba(16,13,11,.22);border-radius:12px;background:#fff}
.opt.on{border:2px solid var(--ink)}
.opt .o{width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(16,13,11,.4);flex:none}
.opt.on .o{border:6px solid var(--ink)}
.sumrow{display:flex;justify-content:space-between;font-size:15px;padding:6px 0}
.size{width:64px;height:48px;border:1px solid rgba(16,13,11,.22);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:600}
.size.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.size.off{color:rgba(16,13,11,.3);text-decoration:line-through}
.check{width:18px;height:18px;border:1.5px solid rgba(16,13,11,.35);border-radius:4px;flex:none}
.check.on{background:var(--ink);border-color:var(--ink)}
.frow{display:flex;align-items:center;gap:10px;font-size:15px;padding:6px 0}
.frow .n{margin-left:auto;color:rgba(16,13,11,.45);font-size:13px}
</style><link rel="stylesheet" href="motion.css"><link rel="stylesheet" href="mobile.css"><style>
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button.pill,button.chip,button.size,button.btn{cursor:pointer}
.bag-n:not(:empty)::before{content:" "}
.acc .h{width:100%;text-align:left}
.foot li a:hover,.foot .base a:hover{text-decoration:underline}
.field input{flex:1;background:transparent;border:0;color:#fff;font:inherit;font-size:16px;outline:none;height:100%}
.field input::placeholder{color:rgba(255,255,255,.6)}
.field button{display:flex;align-items:center;justify-content:center;width:40px;height:40px}
.form-msg{font-size:14px;min-height:20px}
.cur-list button{border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:5px 10px;color:#fff;font-family:inherit;font-size:inherit;text-transform:uppercase}
.cur-list button.on{background:#fff;color:var(--red)}
.cur-pop{position:absolute;z-index:60;background:#fff;color:var(--ink);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:8px;display:flex;flex-direction:column;min-width:200px}
.cur-pop button{text-align:left;padding:10px 12px;border-radius:8px;font-size:15px}
.cur-pop button:hover,.cur-pop button.on{background:var(--paper)}
.cur-pop small{padding:8px 12px 4px;color:rgba(16,13,11,.55);font-size:12px}
.inp{font:inherit;color:var(--ink);width:100%}
input.inp,select.inp,textarea.inp{appearance:none;-webkit-appearance:none}
textarea.inp{height:120px;padding:12px 14px;resize:vertical}
.inp:focus{outline:2px solid var(--ink);outline-offset:1px}
.inp.bad{border-color:#B42F25;background:#FFF6F5}
.err{color:#B42F25;font-size:13px;min-height:0}
.sel-wrap{position:relative}.sel-wrap svg{position:absolute;right:14px;top:16px;pointer-events:none}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;height:40px}
.qty button{width:40px;height:40px;font-size:18px}
.qty b{width:24px;text-align:center}
.linkish{font-size:14px;text-decoration:underline}
.modal-bg{position:fixed;inset:0;background:rgba(16,13,11,.5);z-index:120;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--paper);color:var(--ink);border-radius:20px;padding:28px;width:min(520px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal-box h2{font-size:26px;font-weight:700;letter-spacing:-.02em}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;z-index:130;font-weight:500}
.empty-state{padding:56px 0;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.empty-state h2{font-size:32px;font-weight:700;letter-spacing:-.02em}
.is-hidden{display:none!important}
.heart.on svg path{fill:#B42F25;stroke:#B42F25}
.help-sec{padding:40px 0;border-top:1px solid var(--line);display:flex;gap:48px}
.help-sec h2{width:320px;flex:none;font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1}
.help-sec .c{flex:1;display:flex;flex-direction:column;gap:14px;font-size:17px;line-height:27px;max-width:720px}
.help-sec table{border-collapse:collapse;width:100%;font-size:15px}
.help-sec td,.help-sec th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
.soon{opacity:.6}
.soon .img{filter:grayscale(.3)}
@media (max-width:760px){
  .help-sec{flex-direction:column;gap:16px}.help-sec h2{width:auto;font-size:32px}
  .help-layout{padding:0 16px 48px!important}
}
